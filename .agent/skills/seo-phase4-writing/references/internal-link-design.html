<!-- パーツ：内部リンクボックス（ブログカード） -->
<!-- 使い方: {{URL}}、{{記事タイトル}}、{{画像パス}}を実際の値に置き換える -->
<!-- 必須: .tcj-blogcard関連CSSは投稿本文ではなく、WordPressの追加CSSまたはテーマCSSに定義する -->
<div class="tcj-blogcard">
    <span class="tcj-blogcard-label">あわせて読みたい</span>
    <a href="{{URL}}" class="tcj-blogcard-link">
        <img src="{{画像パス}}" alt="{{記事タイトル}}">
        <span class="tcj-blogcard-title">{{記事タイトル}}</span>
    </a>
</div>
