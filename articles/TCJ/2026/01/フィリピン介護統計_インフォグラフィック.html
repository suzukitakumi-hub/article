<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フィリピン人介護人材 統計データ 2024-2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Noto Sans JP', sans-serif;
            background: #fff;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(135deg, #f5f7fa 0%, #e6f0ff 100%);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 12px rgba(16, 40, 145, 0.1);
        }

        .stats-title {
            text-align: center;
            color: #102891;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: #fff;
            border-radius: 10px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(16, 40, 145, 0.15);
        }

        .stat-number {
            font-size: 42px;
            font-weight: 700;
            color: #102891;
            margin: 15px 0;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 14px;
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .stat-source {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            line-height: 1.3;
        }

        @media (max-width: 1024px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .stat-number {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <div class="stats-container">
        <div class="stats-title">【2024-2025年の最新統計】</div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">特定技能「介護」<br>在留外国人</div>
                <div class="stat-number">4.4万人<br><span style="font-size: 18px;">以上</span></div>
                <div class="stat-source">出典：厚生労働省<br>2024年12月末時点<br>（過去最多）</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">フィリピン人<br>特定技能1号介護職員</div>
                <div class="stat-number">約4,800人</div>
                <div class="stat-source">介護分野全体の約14%<br>出典：出入国在留管理庁<br>2024年12月末時点</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">EPA介護福祉士候補者<br>（フィリピン）累計</div>
                <div class="stat-number">3,105人</div>
                <div class="stat-source">出典：JICWELS<br>2024年度まで</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">2040年<br>介護職員不足数</div>
                <div class="stat-number">約57万人</div>
                <div class="stat-source">出典：厚生労働省推計</div>
            </div>
        </div>
    </div>
</body>

</html>
