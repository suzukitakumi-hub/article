<!-- 
【最終版テンプレート - 公開記事連動】
このテンプレートは、提供いただいた「template.txt」の最終盤デザインを元にしています。
執筆完了後のHTML生成時に使用します。
-->

<div
    style="font-family: 'acumin-pro', 'Noto Sans JP', sans-serif; font-size: 16px; line-height: 1.8; color: #424242; letter-spacing: 0.05em; background: #fff; padding: 20px; max-width: 900px; margin: 0 auto;">

    <!-- リード文 -->
    {{LEAD_TEXT}}

    <!-- この記事を読むとわかること（例） -->
    <h2
        style="font-size: 28px; font-weight: bold; line-height: 1.3; color: #424242; margin-top: 60px; margin-bottom: 24px; padding-bottom: 15px; border-bottom: 2px solid #102891;">
        この記事を読むとわかること</h2>

    <!-- メインコンテンツ -->
    {{MAIN_CONTENT}}

    <!-- まとめ -->
    <h2
        style="font-size: 28px; font-weight: bold; line-height: 1.3; color: #424242; margin-top: 60px; margin-bottom: 24px; border-bottom: 2px solid #102891; padding-bottom: 10px;">
        まとめ</h2>
    {{SUMMARY_TEXT}}

    <!-- フッターCTA -->
    <div style="background-color: #f0f4f8; padding: 40px; border-radius: 10px; margin-top: 60px; text-align: center;">
        <h2 style="font-size: 26px; font-weight: bold; margin-bottom: 20px;">{{CTA_TITLE}}</h2>
        <p style="margin-bottom: 24px;">{{CTA_DESCRIPTION}}</p>
        <p style="margin-bottom: 30px;">{{CTA_CLOSING_TEXT}}</p>
        <a style="display: inline-block; background-color: #102891; color: #fff; padding: 20px 60px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 20px;"
            href="{{CTA_LINK_URL}}">
            {{CTA_BUTTON_TEXT}} →
        </a>
    </div>

</div>
